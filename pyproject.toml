[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qmlbench"
version = "0.1.0"
description = "A fair benchmark of quantum vs classical regression models on periodic, angular and small-data real-world problems (tides, wind, soccer xG, galaxy redshift)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "optuna>=3.6",
    "pennylane>=0.38",
    "torch>=2.2",
    "utide>=0.3",
    "requests>=2.31",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ipykernel>=6", "jupyterlab>=4", "ruff>=0.5"]

[project.scripts]
qmlbench-fetch = "qmlbench.data.fetch_all:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that need internet / downloaded data"]

[tool.ruff]
line-length = 100
